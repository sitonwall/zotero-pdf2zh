[project]
name = "zotero-pdf2zh-whole-document"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "Opt-in document translation worker for Zotero PDF2zh"
dependencies = [
  "flask==3.1.2",
  "babeldoc @ git+https://github.com/sitonwall/BabelDOC.git@f85f85ab043be3f998e5f55a91d50bd2fe391ab2",
]

[dependency-groups]
dev = ["ruff>=0.9.2,<1"]

[tool.uv]
package = false
constraint-dependencies = [
  "bitstring<5",
  "pymupdf<2",
  "peewee<4",
  "openai<2",
  "huggingface-hub<1",
]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"worker/run.py" = ["E402"]
"server/whole_app.py" = ["E402"]
"tests/*.py" = ["E402"]
