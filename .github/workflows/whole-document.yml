name: Whole-document worker

on:
  push:
    paths:
      - 'server/whole_document/**'
      - '.github/workflows/whole-document.yml'
  pull_request:
    paths:
      - 'server/whole_document/**'
      - '.github/workflows/whole-document.yml'

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: server/whole_document
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: 'server/whole_document/uv.lock'
      - name: Install pinned dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check translation worker server/whole_app.py tests scripts
      - name: Offline regressions
        run: uv run python -m unittest discover -s tests -q
      - name: Verify explicit engine hook
        run: uv run python worker/run.py --check
      - name: Real PDF engine with synthetic responses
        run: uv run python scripts/synthetic_pdf.py runs/synthetic
      - name: Hidden HTTP worker against local fake model
        run: uv run python scripts/integration_http.py runs/http runs/synthetic/synthetic-source.pdf
